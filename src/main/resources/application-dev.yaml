# Локальные значения для docker compose. Переопределяются переменными DB_URL, DB_USERNAME, DB_PASSWORD.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${DB_USERNAME:learning}
    password: ${DB_PASSWORD:learning}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  seed:
    enabled: true
