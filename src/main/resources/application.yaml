spring:
  application:
    name: learning-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

app:
  seed:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.learningplatform: info
