services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "5432:5432"
    volumes:
      - learning_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/learning_platform
      DB_USERNAME: learning
      DB_PASSWORD: learning
    ports:
      - "8080:8080"

volumes:
  learning_pg:
